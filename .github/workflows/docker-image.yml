name: Build and push Docker images

on:
  push:
    branches: [main]        # change if your default branch differs
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            file: infra/docker/Dockerfile.backend
            python: true
          - name: daemon
            file: infra/docker/Dockerfile.daemon
            python: true
          - name: agent
            file: infra/docker/Dockerfile.agent
            python: false
          - name: medic
            file: infra/docker/Dockerfile.medic
            python: true
          - name: medic-gateway
            file: infra/docker/Dockerfile.medic-gateway
            python: true
          - name: medic-dockerproxy
            file: infra/docker/Dockerfile.medic-dockerproxy
            python: true
          - name: mcp-runner
            file: infra/docker/Dockerfile.mcp-runner
            python: true

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # GHCR requires lowercase image names
      - name: Lowercase repository name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.REPO }}-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: ${{ matrix.python &&
